<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprobantes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">

    <h2>Comprobantes</h2>

    <div th:replace="~{layout/base :: alertas}"></div>

    <a th:href="@{/comprobantes/nuevo}" class="btn btn-success mb-3">Nuevo comprobante</a>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Cliente</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv, stat : ${lista}">
            <td th:text="${stat.count}"></td>
            <td th:text="${inv.type}"></td>
            <td th:text="${inv.date}"></td>
            <td th:text="${inv.customer != null} ? ${inv.customer.name} : '—'"></td>
            <!--
                Suma todos los subtotales de los detalles del comprobante.
                #aggregates.sum() suma una colección de números.
                inv.details.![subtotal] extrae la lista de subtotales.
            -->
            <td>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="5" class="text-center">No hay comprobantes.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
