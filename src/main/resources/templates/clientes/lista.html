<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">

    <h2>Clientes</h2>

    <div th:replace="~{layout/base :: alertas}"></div>

    <a th:href="@{/clientes/nuevo}" class="btn btn-success mb-3">Nuevo cliente</a>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Documento</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c, stat : ${lista}">
            <td th:text="${stat.count}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.documentType}"></td>
            <td th:text="${c.document}"></td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${c.id})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}"
                   class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="5" class="text-center">No hay clientes.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
