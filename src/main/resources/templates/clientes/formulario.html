<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4" style="max-width:500px">

    <h2 th:text="${customer.id == null} ? 'Nuevo cliente' : 'Editar cliente'"></h2>

    <form th:object="${customer}"
          th:action="@{/clientes/guardar}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre completo *</label>
            <input type="text" class="form-control"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de documento *</label>
            <select class="form-select"
                    th:field="*{documentType}"
                    th:classappend="${#fields.hasErrors('documentType')} ? 'is-invalid'">
                <option value="">-- Seleccionar --</option>
                <option value="DNI">DNI</option>
                <option value="RUC">RUC</option>
            </select>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('documentType')}"
                 th:errors="*{documentType}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Número de documento *</label>
            <input type="text" class="form-control"
                   th:field="*{document}"
                   th:classappend="${#fields.hasErrors('document')} ? 'is-invalid'">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('document')}"
                 th:errors="*{document}">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>
</div>

</body>
</html>
