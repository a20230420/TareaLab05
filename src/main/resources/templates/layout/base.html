<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<!-- FRAGMENTO NAVBAR
     Uso en cualquier página:
     <nav th:replace="~{layout/base :: navbar}"></nav> -->
<nav class="navbar navbar-dark bg-dark" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Inicio</a>
        <div class="d-flex gap-3">
            <a class="nav-link text-white" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link text-white" th:href="@{/productos}">Productos</a>
            <a class="nav-link text-white" th:href="@{/comprobantes}">Comprobantes</a>
        </div>
    </div>
</nav>

<!-- FRAGMENTO ALERTAS
     Uso en cualquier página:
     <div th:replace="~{layout/base :: alertas}"></div> -->
<th:block th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alert-dismissible mt-2">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible mt-2">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</th:block>

</body>
</html>
