<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4">

    <h2>Productos</h2>

    <div th:replace="~{layout/base :: alertas}"></div>

    <a th:href="@{/productos/nuevo}" class="btn btn-success mb-3">Nuevo producto</a>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p, stat : ${lista}">
            <td th:text="${stat.count}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
                   class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="5" class="text-center">No hay productos.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
