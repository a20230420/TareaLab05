<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container mt-4" style="max-width:500px">

    <h2 th:text="${product.id == null} ? 'Nuevo producto' : 'Editar producto'"></h2>

    <form th:object="${product}"
          th:action="@{/productos/guardar}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio *</label>
            <input type="text" class="form-control"
                   th:field="*{price}"
                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock *</label>
            <input type="text" class="form-control"
                   th:field="*{stock}"
                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('stock')}"
                 th:errors="*{stock}">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>
</div>

</body>
</html>
